<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhật ký điểm danh - Giảng viên</title>
  <link rel="stylesheet" href="../../admin/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
  <nav class="navbar">
    <ul>
      <li><a href="user_gv.html"><i class="fas fa-home"></i> Trang chủ</a></li>
      <li><a href="student_gv.html"><i class="fas fa-user-graduate"></i> Quản lý sinh viên</a></li>
      <li><a href="log_gv.html" class="active"><i class="fas fa-clipboard-list"></i> Nhật ký điểm danh</a></li>
      <li><a href="../../login/login.html"><i class="fas fa-sign-out-alt"></i> Đăng xuất</a></li>
    </ul>
  </nav>

  <div class="main-container">
    <div class="content-section">
      <div class="section-header">
        <h2 class="section-title">📒 Nhật ký điểm danh</h2>
        <button class="btn btn-primary" onclick="refreshData()">
          <i class="fas fa-sync-alt"></i> Làm mới
        </button>
      </div>

      <div class="search-container">
        <input type="date" class="form-input" id="dateFilter" onchange="filterAttendance()">
        <select class="filter-select" id="subjectFilter" onchange="filterAttendance()">
          <option value="">Tất cả môn học</option>
        </select>
        <input type="text" class="search-box" id="searchAttendance" placeholder="Tìm theo MSSV hoặc tên..."
          oninput="filterAttendance()">
        <button class="btn btn-success" onclick="exportAttendance()">
          <i class="fas fa-download"></i> Xuất Excel
        </button>
      </div>

      <!-- Thống kê nhanh -->
      <div class="dashboard-grid" style="margin-bottom: 20px;">
        <div class="dashboard-card">
          <div class="card-header">
            <div class="card-icon attendance">
              <i class="fas fa-check-circle"></i>
            </div>
            <div>
              <div class="card-title">Tổng điểm danh</div>
              <div class="card-value" id="totalAttendance">0</div>
            </div>
          </div>
        </div>

        <div class="dashboard-card">
          <div class="card-header">
            <div class="card-icon students">
              <i class="fas fa-user-graduate"></i>
            </div>
            <div>
              <div class="card-title">Sinh viên có mặt</div>
              <div class="card-value" id="presentCount">0</div>
            </div>
          </div>
        </div>

        <div class="dashboard-card">
          <div class="card-header">
            <div class="card-icon teachers">
              <i class="fas fa-times-circle"></i>
            </div>
            <div>
              <div class="card-title">Sinh viên vắng</div>
              <div class="card-value" id="absentCount">0</div>
            </div>
          </div>
        </div>

        <div class="dashboard-card">
          <div class="card-header">
            <div class="card-icon subjects">
              <i class="fas fa-chart-line"></i>
            </div>
            <div>
              <div class="card-title">Tỉ lệ có mặt</div>
              <div class="card-value" id="attendanceRate">0%</div>
            </div>
          </div>
        </div>
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th>STT</th>
            <th>Ngày</th>
            <th>MSSV</th>
            <th>Họ tên</th>
            <th>Môn học</th>
            <th>Giờ điểm danh</th>
            <th>Trạng thái</th>
            <th>Độ chính xác AI</th>
            <th>Thao tác</th>
          </tr>
        </thead>
        <tbody id="attendanceTable">
          <!-- Data will be loaded here -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Chi tiết điểm danh Modal -->
  <div id="attendanceDetailModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Chi tiết điểm danh</h3>
        <span class="close" onclick="closeModal('attendanceDetailModal')">&times;</span>
      </div>
      <div id="attendanceDetailContent">
        <!-- Content will be loaded here -->
      </div>
    </div>
  </div>

  <script src="log_gv.js"></script>
</body>

</html>
