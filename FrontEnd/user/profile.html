<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thông tin cá nhân</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: #f0f4f8;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #2c3e50;
      color: white;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .header-left img {
      width: 130px;
      height: auto;
      object-fit: contain;
    }

    .header-title {
      flex-grow: 1;
      font-size: 28px;
      text-align: center;
      text-shadow: 0 0 4px #0f0, 0 0 8px #0f0;
      color: #e4f0f1;
    }

    .user-options {
      text-align: right;
      font-size: 14px;
    }

    #date,
    #time {
      display: block;
      color: #b8f3f9;
      margin-bottom: 4px;
    }

    .dropdown {
      position: relative;
      display: inline-block;
    }

    #userMenuBtn {
      background-color: #007acc;
      color: white;
      padding: 6px 12px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #userMenuBtn:hover {
      background-color: #005a99;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      background-color: white;
      min-width: 160px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
      border-radius: 6px;
      z-index: 999;
      overflow: hidden;
    }

    .dropdown-content a {
      color: #333;
      padding: 10px 14px;
      text-decoration: none;
      display: block;
      font-size: 14px;
    }

    .dropdown-content a:hover {
      background-color: #f5f5f5;
    }

   main.user-page {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 30px 60px;       /* thêm padding ngang */
  flex-grow: 1;
  width: 100%;
  max-width: 100%;
}

.student-info-container {
  background-color: #fff;
  border-radius: 12px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
  padding: 30px 40px;
  width: 100%;
  max-width: 2000px;   /* Tăng từ 600px lên 900px hoặc hơn nếu muốn */
  margin: 0 auto;
}

.info h2 {
  margin-bottom: 20px;
  color: #007acc;
}

    .info label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    .info input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-top: 4px;
    }

    .info button {
      margin-top: 20px;
      padding: 10px;
      width: 100%;
      background-color: #007acc;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    .info button:hover {
      background-color: #005fa3;
    }

    footer {
      text-align: center;
      padding: 15px;
      background-color: #2c3e50;
      color: white;
      margin-top: auto;
    }

    @media (max-width: 600px) {
      .info h2 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header>
    <div class="header-left">
      <img src="../image/logo.png" alt="Logo UTH">
    </div>
    <h1 class="header-title"><b>UNIFIED UTH FACIAL RECOGNITION SYSTEM</b></h1>
    <div class="user-options">
      <b><i><span id="date">Ngày: --/--/----</span></i></b>
      <b><i><span id="time">Giờ: --:--</span></i></b><br>
      <div class="dropdown">
        <button id="userMenuBtn">👤 Tài khoản ▾</button>
        <div id="userDropdown" class="dropdown-content">
          <a href="profile.html">Thông tin cá nhân</a>
          <a href="../login/login.html">Đăng xuất</a>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="user-page">
    <section class="student-info">
      <div class="student-info-container">
        <div class="info">
          <h2>📝 Chỉnh sửa thông tin cá nhân</h2>
          <form id="profileForm">
            <label>Họ tên:</label>
            <input type="text" id="fullName" required />

            <label>MSSV:</label>
            <input type="text" id="studentID" required />

            <label>Lớp:</label>
            <input type="text" id="studentClass" />

            <label>Khóa học:</label>
            <input type="text" id="studentCourse" />

            <label>Ngày sinh:</label>
            <input type="date" id="dob" />

            <label>Email:</label>
            <input type="email" id="email" />

            <label>Số điện thoại:</label>
            <input type="text" id="phone" />

            <label>Địa chỉ:</label>
            <input type="text" id="address" />

            <button type="submit">💾 Lưu thông tin</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2025 Hệ thống điểm danh sinh viên.</p>
  </footer>

  <!-- JS -->
  <script src="../jquery-3.7.1.min.js"></script>
   <script>
  function updateDateTime() {
    const now = new Date();
    const dateStr = now.toLocaleDateString('vi-VN');
    const timeStr = now.toLocaleTimeString('vi-VN');
    $('#date').text('Ngày: ' + dateStr);
    $('#time').text('Giờ: ' + timeStr);
    $('#attendance-time').text(timeStr + ' - ' + dateStr); // chỉ dùng nếu có #attendance-time
  }

  $(document).ready(function () {
    // Cập nhật thời gian liên tục
    updateDateTime();
    setInterval(updateDateTime, 1000);

    const currentUser = localStorage.getItem("currentUser");
    const userData = JSON.parse(localStorage.getItem("user_" + currentUser));

    // Load dữ liệu vào form
    if (userData) {
      $('#fullName').val(userData.fullName || '');
      $('#studentID').val(userData.studentID || '');
      $('#studentClass').val(userData.class || '');
      $('#studentCourse').val(userData.course || '');
      $('#dob').val(userData.dob || '');
      $('#email').val(userData.email || '');
      $('#phone').val(userData.phone || '');
      $('#address').val(userData.address || '');
    }

    // Lưu thông tin khi submit
    $('#profileForm').submit(function (e) {
      e.preventDefault();

      if (userData) {
        userData.fullName = $('#fullName').val().trim();
        userData.studentID = $('#studentID').val().trim();
        userData.class = $('#studentClass').val().trim();
        userData.course = $('#studentCourse').val().trim();
        userData.dob = $('#dob').val();
        userData.email = $('#email').val().trim();
        userData.phone = $('#phone').val().trim();
        userData.address = $('#address').val().trim();

        localStorage.setItem("user_" + currentUser, JSON.stringify(userData));
        alert("Thông tin đã được cập nhật!");
        window.location.href = "user.html"; // hoặc "user_sv.html"
      }
    });

    // Hiện/ẩn dropdown menu
    $('#userMenuBtn').click(function () {
      $('#userDropdown').toggle();
    });

    // Ẩn dropdown khi click ra ngoài
    $(document).click(function (e) {
      if (!$(e.target).closest('#userMenuBtn, #userDropdown').length) {
        $('#userDropdown').hide();
      }
    });
  });
</script>

  
</body>
</html>
