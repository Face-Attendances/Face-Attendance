<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký môn học - Sinh viên</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .header h1 {
            margin-bottom: 0.5rem;
        }

        .header p {
            opacity: 0.9;
        }

        .content {
            padding: 2rem;
        }

        .search-section {
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 0.75rem;
            border: 2px solid #e1e5e9;
            border-radius: 5px;
            font-size: 1rem;
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }

        .filter-select {
            padding: 0.75rem;
            border: 2px solid #e1e5e9;
            border-radius: 5px;
            font-size: 1rem;
            min-width: 150px;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-success {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        }

        .btn-danger {
            background: linear-gradient(135deg, #dc3545 0%, #fd7e14 100%);
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .subject-card {
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        .subject-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .subject-card.registered {
            border-color: #28a745;
            background-color: #f8fff9;
        }

        .subject-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .subject-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .subject-code {
            color: #666;
            font-size: 0.9rem;
        }

        .subject-info {
            margin-bottom: 1rem;
        }

        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .info-item i {
            width: 20px;
            margin-right: 0.5rem;
            color: #667eea;
        }

        .subject-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
        }

        .registered-subjects {
            margin-top: 2rem;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e1e5e9;
        }

        .alert {
            padding: 1rem;
            border-radius: 5px;
            margin-bottom: 1rem;
            display: none;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            display: none;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .back-link {
            text-align: center;
            margin-top: 1rem;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #666;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #ccc;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-book"></i> Đăng ký môn học</h1>
            <p>Chọn các môn học bạn muốn đăng ký trong học kỳ này</p>
        </div>

        <div class="content">
            <div id="alert" class="alert"></div>

            <div class="search-section">
                <input type="text" class="search-box" id="searchSubject" placeholder="Tìm kiếm môn học...">
                <select class="filter-select" id="filterTeacher">
                    <option value="">Tất cả giảng viên</option>
                </select>
                <button class="btn" onclick="loadSubjects()">
                    <i class="fas fa-search"></i> Tìm kiếm
                </button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Đang tải dữ liệu...</p>
            </div>

            <div id="subjectsContainer">
                <div class="subjects-grid" id="subjectsGrid">
                    <!-- Subjects will be loaded here -->
                </div>
            </div>

            <div class="registered-subjects">
                <h2 class="section-title">
                    <i class="fas fa-check-circle"></i> Môn học đã đăng ký
                </h2>
                <div class="subjects-grid" id="registeredSubjectsGrid">
                    <!-- Registered subjects will be loaded here -->
                </div>
            </div>

            <div class="back-link">
                <a href="user.html"><i class="fas fa-arrow-left"></i> Quay lại trang chủ</a>
            </div>
        </div>
    </div>

    <script>
        let allSubjects = [];
        let registeredSubjects = [];
        let teachers = [];

        // Initialize page
        document.addEventListener('DOMContentLoaded', function () {
            loadSubjects();
            loadRegisteredSubjects();
            loadTeachers();
            setupEventListeners();
        });

        // Setup event listeners
        function setupEventListeners() {
            document.getElementById('searchSubject').addEventListener('input', filterSubjects);
            document.getElementById('filterTeacher').addEventListener('change', filterSubjects);
        }

        // Load all subjects
        async function loadSubjects() {
            showLoading(true);
            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch('http://localhost:8000/api/database/subjects/', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    allSubjects = await response.json();
                    displaySubjects(allSubjects);
                } else {
                    showAlert('Lỗi khi tải danh sách môn học', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('Không thể kết nối đến server', 'error');
            } finally {
                showLoading(false);
            }
        }

        // Load registered subjects
        async function loadRegisteredSubjects() {
            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch('http://localhost:8000/api/database/student-subjects/', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    registeredSubjects = await response.json();
                    displayRegisteredSubjects();
                }
            } catch (error) {
                console.error('Error loading registered subjects:', error);
            }
        }

        // Load teachers
        async function loadTeachers() {
            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch('http://localhost:8000/api/database/teachers/', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    teachers = await response.json();
                    updateTeacherFilter();
                }
            } catch (error) {
                console.error('Error loading teachers:', error);
            }
        }

        // Display subjects
        function displaySubjects(subjects) {
            const grid = document.getElementById('subjectsGrid');
            grid.innerHTML = '';

            if (subjects.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <p>Không tìm thấy môn học nào</p>
                    </div>
                `;
                return;
            }

            subjects.forEach(subject => {
                const isRegistered = registeredSubjects.some(rs => rs.subject === subject.id);
                const teacher = teachers.find(t => t.id === subject.teacher);

                const card = document.createElement('div');
                card.className = `subject-card ${isRegistered ? 'registered' : ''}`;
                card.innerHTML = `
                    <div class="subject-header">
                        <div>
                            <div class="subject-title">${subject.name}</div>
                            <div class="subject-code">${subject.subject_code}</div>
                        </div>
                        <div class="subject-actions">
                            ${isRegistered ?
                        `<button class="btn btn-danger btn-sm" onclick="unregisterSubject(${subject.id})">
                                    <i class="fas fa-times"></i> Hủy đăng ký
                                </button>` :
                        `<button class="btn btn-success btn-sm" onclick="registerSubject(${subject.id})">
                                    <i class="fas fa-plus"></i> Đăng ký
                                </button>`
                    }
                        </div>
                    </div>
                    <div class="subject-info">
                        <div class="info-item">
                            <i class="fas fa-user"></i>
                            <span>Giảng viên: ${teacher ? teacher.name : 'Chưa phân công'}</span>
                        </div>
                        <div class="info-item">
                            <i class="fas fa-clock"></i>
                            <span>Thời gian: ${subject.time || 'Chưa cập nhật'}</span>
                        </div>
                        <div class="info-item">
                            <i class="fas fa-map-marker-alt"></i>
                            <span>Phòng học: ${subject.room || 'Chưa cập nhật'}</span>
                        </div>
                        <div class="info-item">
                            <i class="fas fa-graduation-cap"></i>
                            <span>Số tín chỉ: ${subject.credits || 'Chưa cập nhật'}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Display registered subjects
        function displayRegisteredSubjects() {
            const grid = document.getElementById('registeredSubjectsGrid');
            grid.innerHTML = '';

            if (registeredSubjects.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-book-open"></i>
                        <p>Bạn chưa đăng ký môn học nào</p>
                    </div>
                `;
                return;
            }

            registeredSubjects.forEach(registration => {
                const subject = allSubjects.find(s => s.id === registration.subject);
                if (!subject) return;

                const teacher = teachers.find(t => t.id === subject.teacher);

                const card = document.createElement('div');
                card.className = 'subject-card registered';
                card.innerHTML = `
                    <div class="subject-header">
                        <div>
                            <div class="subject-title">${subject.name}</div>
                            <div class="subject-code">${subject.subject_code}</div>
                        </div>
                        <div class="subject-actions">
                            <button class="btn btn-danger btn-sm" onclick="unregisterSubject(${subject.id})">
                                <i class="fas fa-times"></i> Hủy đăng ký
                            </button>
                        </div>
                    </div>
                    <div class="subject-info">
                        <div class="info-item">
                            <i class="fas fa-user"></i>
                            <span>Giảng viên: ${teacher ? teacher.name : 'Chưa phân công'}</span>
                        </div>
                        <div class="info-item">
                            <i class="fas fa-clock"></i>
                            <span>Thời gian: ${subject.time || 'Chưa cập nhật'}</span>
                        </div>
                        <div class="info-item">
                            <i class="fas fa-calendar"></i>
                            <span>Học kỳ: ${registration.semester || 'Chưa cập nhật'}</span>
                        </div>
                        <div class="info-item">
                            <i class="fas fa-calendar-alt"></i>
                            <span>Năm học: ${registration.academic_year || 'Chưa cập nhật'}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Filter subjects
        function filterSubjects() {
            const searchTerm = document.getElementById('searchSubject').value.toLowerCase();
            const teacherFilter = document.getElementById('filterTeacher').value;

            const filtered = allSubjects.filter(subject => {
                const matchesSearch = !searchTerm ||
                    subject.name.toLowerCase().includes(searchTerm) ||
                    subject.subject_code.toLowerCase().includes(searchTerm);

                const matchesTeacher = !teacherFilter || subject.teacher == teacherFilter;

                return matchesSearch && matchesTeacher;
            });

            displaySubjects(filtered);
        }

        // Update teacher filter
        function updateTeacherFilter() {
            const select = document.getElementById('filterTeacher');
            const currentValue = select.value;

            select.innerHTML = '<option value="">Tất cả giảng viên</option>';

            const uniqueTeachers = [...new Set(allSubjects.map(s => s.teacher))];
            uniqueTeachers.forEach(teacherId => {
                const teacher = teachers.find(t => t.id === teacherId);
                if (teacher) {
                    const option = document.createElement('option');
                    option.value = teacherId;
                    option.textContent = teacher.name;
                    if (teacherId == currentValue) {
                        option.selected = true;
                    }
                    select.appendChild(option);
                }
            });
        }

        // Register subject
        async function registerSubject(subjectId) {
            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch('http://localhost:8000/api/database/student-subjects/create/', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        subject: subjectId,
                        semester: 'Học kỳ 1',
                        academic_year: '2024-2025'
                    })
                });

                if (response.ok) {
                    showAlert('Đăng ký môn học thành công!', 'success');
                    loadRegisteredSubjects();
                    loadSubjects(); // Refresh to update UI
                } else {
                    const error = await response.json();
                    showAlert(error.error || 'Lỗi khi đăng ký môn học', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('Không thể kết nối đến server', 'error');
            }
        }

        // Unregister subject
        async function unregisterSubject(subjectId) {
            if (!confirm('Bạn có chắc chắn muốn hủy đăng ký môn học này?')) {
                return;
            }

            try {
                const registration = registeredSubjects.find(rs => rs.subject === subjectId);
                if (!registration) {
                    showAlert('Không tìm thấy đăng ký môn học', 'error');
                    return;
                }

                const token = localStorage.getItem('accessToken');
                const response = await fetch(`http://localhost:8000/api/database/student-subjects/${registration.id}/`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    showAlert('Hủy đăng ký môn học thành công!', 'success');
                    loadRegisteredSubjects();
                    loadSubjects(); // Refresh to update UI
                } else {
                    showAlert('Lỗi khi hủy đăng ký môn học', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('Không thể kết nối đến server', 'error');
            }
        }

        // Show/hide loading
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        // Show alert message
        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';

            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }

        // Check if user is logged in
        document.addEventListener('DOMContentLoaded', function () {
            const token = localStorage.getItem('accessToken');
            if (!token) {
                window.location.href = '../login/login.html';
            }
        });
    </script>
</body>

</html>
