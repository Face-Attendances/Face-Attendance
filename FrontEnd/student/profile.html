<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thông tin cá nhân - Hệ thống điểm danh khuôn mặt</title>
    <link rel="stylesheet" href="student.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .profile-page {
            max-width: 800px;
            margin: 24px auto;
            padding: 0 24px;
        }

        .profile-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .profile-header {
            display: flex;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
            position: relative;
        }

        .profile-header::before {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 60px;
            height: 2px;
            background: #2d3748;
            border-radius: 1px;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 20px;
            color: white;
            font-size: 2rem;
            font-weight: 600;
            position: relative;
        }

        .profile-avatar::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            z-index: -1;
        }

        .profile-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #2d3748;
            margin: 0;
        }

        .profile-subtitle {
            color: #718096;
            font-size: 0.875rem;
            margin-top: 4px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-label {
            font-weight: 500;
            color: #2d3748;
            margin-bottom: 8px;
            font-size: 0.875rem;
        }

        .form-input {
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.875rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            background: white;
        }

        .form-input:focus {
            outline: none;
            border-color: #2d3748;
            box-shadow: 0 0 0 3px rgba(45, 55, 72, 0.1);
        }

        .form-input:disabled {
            background: #f7fafc;
            color: #718096;
            cursor: not-allowed;
        }

        .form-actions {
            display: flex;
            gap: 16px;
            justify-content: flex-end;
            padding-top: 24px;
            border-top: 1px solid #e2e8f0;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
        }

        .btn-primary {
            background: #2d3748;
            color: white;
        }

        .btn-primary:hover {
            background: #1a202c;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #718096;
            color: white;
        }

        .btn-secondary:hover {
            background: #4a5568;
        }

        .btn-danger {
            background: #e53e3e;
            color: white;
        }

        .btn-danger:hover {
            background: #c53030;
        }

        .alert {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            display: none;
        }

        .alert-success {
            background: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }

        .alert-error {
            background: #fed7d7;
            color: #742a2a;
            border: 1px solid #feb2b2;
        }

        .loading {
            display: none;
            align-items: center;
            gap: 12px;
            color: #718096;
        }

        .loading::before {
            content: '';
            width: 16px;
            height: 16px;
            border: 2px solid #e2e8f0;
            border-top: 2px solid #718096;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-actions {
                flex-direction: column;
            }

            .profile-header {
                flex-direction: column;
                text-align: center;
            }

            .profile-avatar {
                margin-right: 0;
                margin-bottom: 16px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="header-left">
            <img src="../assets/images/logo.png" alt="Logo UTH">
            <h1 class="header-title">Thông tin cá nhân</h1>
        </div>
        <div class="user-options">
            <span id="currentDateTime"></span>
            <div class="dropdown">
                <button id="userMenuBtn">
                    <i class="fas fa-user"></i>
                    <span id="userName">Sinh viên</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="dropdown-content" id="userMenu">
                    <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
                    <a href="subject-registration.html"><i class="fas fa-book"></i> Đăng ký môn học</a>
                    <a href="attendance-history.html"><i class="fas fa-history"></i> Lịch sử điểm danh</a>
                    <a href="change-password.html"><i class="fas fa-key"></i> Đổi mật khẩu</a>
                    <a href="../login/login.html" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Đăng xuất</a>
                </div>
            </div>
        </div>
    </header>

    <main class="profile-page">
        <div class="profile-container">
            <div class="profile-header">
                <div class="profile-avatar">
                    <i class="fas fa-user-graduate"></i>
                </div>
                <div>
                    <h2 class="profile-title">Thông tin cá nhân</h2>
                    <p class="profile-subtitle">Cập nhật thông tin cá nhân của bạn</p>
                </div>
            </div>

            <div id="alertContainer"></div>

            <form id="profileForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Họ và tên</label>
                        <input type="text" class="form-input" id="fullName" name="fullName" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Mã số sinh viên</label>
                        <input type="text" class="form-input" id="studentCode" name="studentCode" disabled>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Lớp</label>
                        <input type="text" class="form-input" id="studentClass" name="studentClass" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Khóa học</label>
                        <input type="text" class="form-input" id="course" name="course" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-input" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Số điện thoại</label>
                        <input type="tel" class="form-input" id="phone" name="phone" required>
                    </div>

                    <div class="form-group full-width">
                        <label class="form-label">Địa chỉ</label>
                        <input type="text" class="form-input" id="address" name="address" required>
                    </div>
                </div>

                <div class="form-actions">
                    <a href="dashboard.html" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Quay lại
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Lưu thay đổi
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2025 Hệ thống điểm danh khuôn mặt. All rights reserved.</p>
            <p>Được phát triển bởi UTH Team</p>
        </div>
    </footer>

    <script src="../shared/js/jquery-3.7.1.min.js"></script>
    <script src="student.js"></script>
    <script>
        // Load user profile data
        document.addEventListener('DOMContentLoaded', function () {
            loadUserProfile();
            updateDateTime();
            setInterval(updateDateTime, 1000);
        });

        async function loadUserProfile() {
            try {
                const token = localStorage.getItem('accessToken');
                if (!token) {
                    window.location.href = '../login/login.html';
                    return;
                }

                const response = await fetch('http://localhost:8000/api/users/profile/', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const userData = await response.json();

                    // Populate form fields with real data
                    document.getElementById('fullName').value = userData.full_name || '';
                    document.getElementById('studentCode').value = userData.username || '';
                    document.getElementById('studentClass').value = userData.student_class || '';
                    document.getElementById('course').value = userData.course || '';
                    document.getElementById('email').value = userData.email || '';
                    document.getElementById('phone').value = userData.phone_number || '';
                    document.getElementById('address').value = userData.address || '';
                } else {
                    showToast('Lỗi khi tải thông tin người dùng', 'error');
                }
            } catch (error) {
                console.error('Error loading user profile:', error);
                showToast('Lỗi khi tải thông tin người dùng', 'error');
            }
        }

        // Handle form submission
        document.getElementById('profileForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            try {
                const token = localStorage.getItem('accessToken');
                if (!token) {
                    window.location.href = '../login/login.html';
                    return;
                }

                const formData = {
                    full_name: document.getElementById('fullName').value,
                    student_class: document.getElementById('studentClass').value,
                    course: document.getElementById('course').value,
                    email: document.getElementById('email').value,
                    phone_number: document.getElementById('phone').value,
                    address: document.getElementById('address').value
                };

                const response = await fetch('http://localhost:8000/api/users/profile/', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    showToast('Cập nhật thông tin thành công!', 'success');
                } else {
                    const error = await response.json();
                    showToast(error.message || 'Cập nhật thất bại', 'error');
                }
            } catch (error) {
                console.error('Error updating profile:', error);
                showToast('Lỗi khi cập nhật thông tin', 'error');
            }
        });

        // Toast notification
        function showToast(message, type = 'info') {
            const alertContainer = document.getElementById('alertContainer');
            if (!alertContainer) return;

            const toast = document.createElement('div');
            toast.className = `alert alert-${type}`;
            toast.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
                <span>${message}</span>
            `;

            alertContainer.appendChild(toast);

            // Auto remove after 5 seconds
            setTimeout(() => {
                toast.remove();
            }, 5000);
        }

        function updateDateTime() {
            const now = new Date();
            const dateTimeElement = document.getElementById('currentDateTime');

            if (dateTimeElement) {
                const formatted = now.toLocaleString('vi-VN', {
                    weekday: 'long',
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                });

                dateTimeElement.textContent = `🕒 ${formatted}`;
            }
        }

        function logout() {
            localStorage.removeItem('accessToken');
            localStorage.removeItem('refreshToken');
            window.location.href = '../login/login.html';
        }
    </script>
</body>

</html>
