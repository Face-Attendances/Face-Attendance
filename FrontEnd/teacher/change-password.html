<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu - Hệ thống điểm danh khuôn mặt</title>
    <link rel="stylesheet" href="teacher.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .change-password-page {
            max-width: 600px;
            margin: 24px auto;
            padding: 0 24px;
        }

        .change-password-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .change-password-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .change-password-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            color: white;
            font-size: 2rem;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .change-password-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .change-password-subtitle {
            color: #718096;
            font-size: 0.875rem;
        }

        .password-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            position: relative;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #2d3748;
            font-size: 0.875rem;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.875rem;
            transition: all 0.3s ease;
            background: white;
            color: #2d3748;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-1px);
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            font-size: 1rem;
            transition: color 0.3s ease;
        }

        .form-input:focus+.input-icon {
            color: #667eea;
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #a0aec0;
            cursor: pointer;
            font-size: 1rem;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: #667eea;
        }

        .password-strength {
            margin-top: 8px;
            font-size: 0.75rem;
        }

        .strength-weak {
            color: #e53e3e;
        }

        .strength-medium {
            color: #ed8936;
        }

        .strength-strong {
            color: #38a169;
        }

        .form-actions {
            display: flex;
            gap: 16px;
            justify-content: flex-end;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #e2e8f0;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            font-size: 0.875rem;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #718096 0%, #4a5568 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(113, 128, 150, 0.3);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(113, 128, 150, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 24px;
            display: none;
            animation: slideIn 0.3s ease-out;
        }

        .alert-success {
            background: linear-gradient(135deg, #c6f6d5 0%, #9ae6b4 100%);
            color: #22543d;
            border: 1px solid #68d391;
        }

        .alert-error {
            background: linear-gradient(135deg, #fed7d7 0%, #feb2b2 100%);
            color: #742a2a;
            border: 1px solid #fc8181;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-size: 0.875rem;
        }

        .loading::before {
            content: '';
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .change-password-page {
                padding: 0 16px;
            }

            .change-password-container {
                padding: 24px;
            }

            .form-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="header-left">
            <img src="../assets/images/logo.png" alt="Logo UTH">
            <h1 class="header-title">Đổi mật khẩu</h1>
        </div>
        <div class="user-options">
            <span id="currentDateTime"></span>
            <div class="dropdown">
                <button id="userMenuBtn">
                    <i class="fas fa-user-tie"></i>
                    <span id="userName">Giảng viên</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="dropdown-content" id="userMenu">
                    <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
                    <a href="profile.html"><i class="fas fa-user-edit"></i> Thông tin cá nhân</a>
                    <a href="my-subjects.html"><i class="fas fa-book"></i> Môn học của tôi</a>
                    <a href="student-management.html"><i class="fas fa-users"></i> Quản lý sinh viên</a>
                    <a href="attendance-log.html"><i class="fas fa-clipboard-list"></i> Nhật ký điểm danh</a>
                    <a href="../login/login.html" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Đăng xuất</a>
                </div>
            </div>
        </div>
    </header>

    <main class="change-password-page">
        <div class="change-password-container">
            <div class="change-password-header">
                <div class="change-password-icon">
                    <i class="fas fa-key"></i>
                </div>
                <h2 class="change-password-title">Đổi mật khẩu</h2>
                <p class="change-password-subtitle">Cập nhật mật khẩu mới cho tài khoản của bạn</p>
            </div>

            <div id="alertContainer"></div>

            <form id="changePasswordForm" class="password-form">
                <div class="form-group">
                    <label class="form-label">Mật khẩu hiện tại</label>
                    <div class="input-group">
                        <input type="password" class="form-input" id="currentPassword" name="currentPassword"
                            placeholder="Nhập mật khẩu hiện tại" required>
                        <i class="input-icon fas fa-lock"></i>
                        <button type="button" class="password-toggle" onclick="togglePassword('currentPassword')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Mật khẩu mới</label>
                    <div class="input-group">
                        <input type="password" class="form-input" id="newPassword" name="newPassword"
                            placeholder="Nhập mật khẩu mới" required>
                        <i class="input-icon fas fa-key"></i>
                        <button type="button" class="password-toggle" onclick="togglePassword('newPassword')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-strength" id="passwordStrength"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">Xác nhận mật khẩu mới</label>
                    <div class="input-group">
                        <input type="password" class="form-input" id="confirmPassword" name="confirmPassword"
                            placeholder="Nhập lại mật khẩu mới" required>
                        <i class="input-icon fas fa-check-circle"></i>
                        <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-actions">
                    <a href="dashboard.html" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Quay lại
                    </a>
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <span class="btn-text">
                            <i class="fas fa-save"></i> Đổi mật khẩu
                        </span>
                        <span class="loading" style="display: none;">
                            <i class="fas fa-spinner fa-spin"></i> Đang xử lý...
                        </span>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2025 Hệ thống điểm danh khuôn mặt. All rights reserved.</p>
            <p>Được phát triển bởi UTH Team</p>
        </div>
    </footer>

    <script src="../shared/js/jquery-3.7.1.min.js"></script>
    <script src="teacher.js"></script>
    <script>
        // Initialize page
        document.addEventListener('DOMContentLoaded', function () {
            setupEventListeners();
            updateDateTime();
            setInterval(updateDateTime, 1000);
        });

        // Setup event listeners
        function setupEventListeners() {
            const form = document.getElementById('changePasswordForm');
            if (form) {
                form.addEventListener('submit', handleChangePassword);
            }

            // Password strength checker
            const newPasswordInput = document.getElementById('newPassword');
            if (newPasswordInput) {
                newPasswordInput.addEventListener('input', checkPasswordStrength);
            }

            // Confirm password checker
            const confirmPasswordInput = document.getElementById('confirmPassword');
            if (confirmPasswordInput) {
                confirmPasswordInput.addEventListener('input', checkPasswordMatch);
            }
        }

        // Handle password change
        async function handleChangePassword(event) {
            event.preventDefault();

            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validate inputs
            if (!validateForm(currentPassword, newPassword, confirmPassword)) {
                return;
            }

            // Show loading state
            setLoadingState(true);

            try {
                // Mock API call - replace with actual API
                await new Promise(resolve => setTimeout(resolve, 2000));

                showToast('Đổi mật khẩu thành công!', 'success');

                // Reset form
                document.getElementById('changePasswordForm').reset();

                // Redirect to dashboard after 2 seconds
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 2000);

            } catch (error) {
                console.error('Change password error:', error);
                showToast('Lỗi khi đổi mật khẩu. Vui lòng thử lại.', 'error');
            } finally {
                setLoadingState(false);
            }
        }

        // Validate form
        function validateForm(currentPassword, newPassword, confirmPassword) {
            if (!currentPassword) {
                showToast('Vui lòng nhập mật khẩu hiện tại', 'error');
                return false;
            }

            if (!newPassword) {
                showToast('Vui lòng nhập mật khẩu mới', 'error');
                return false;
            }

            if (newPassword.length < 8) {
                showToast('Mật khẩu mới phải có ít nhất 8 ký tự', 'error');
                return false;
            }

            if (newPassword === currentPassword) {
                showToast('Mật khẩu mới không được trùng với mật khẩu hiện tại', 'error');
                return false;
            }

            if (newPassword !== confirmPassword) {
                showToast('Mật khẩu xác nhận không khớp', 'error');
                return false;
            }

            return true;
        }

        // Check password strength
        function checkPasswordStrength() {
            const password = document.getElementById('newPassword').value;
            const strengthDiv = document.getElementById('passwordStrength');

            if (!password) {
                strengthDiv.textContent = '';
                strengthDiv.className = 'password-strength';
                return;
            }

            let strength = 0;
            let feedback = [];

            if (password.length >= 8) strength++;
            else feedback.push('Ít nhất 8 ký tự');

            if (/[a-z]/.test(password)) strength++;
            else feedback.push('Chữ thường');

            if (/[A-Z]/.test(password)) strength++;
            else feedback.push('Chữ hoa');

            if (/[0-9]/.test(password)) strength++;
            else feedback.push('Số');

            if (/[^A-Za-z0-9]/.test(password)) strength++;
            else feedback.push('Ký tự đặc biệt');

            let strengthText = '';
            let strengthClass = '';

            if (strength <= 2) {
                strengthText = 'Yếu';
                strengthClass = 'strength-weak';
            } else if (strength <= 3) {
                strengthText = 'Trung bình';
                strengthClass = 'strength-medium';
            } else {
                strengthText = 'Mạnh';
                strengthClass = 'strength-strong';
            }

            strengthDiv.textContent = `Độ mạnh: ${strengthText}`;
            strengthDiv.className = `password-strength ${strengthClass}`;
        }

        // Check password match
        function checkPasswordMatch() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const confirmInput = document.getElementById('confirmPassword');

            if (confirmPassword && newPassword !== confirmPassword) {
                confirmInput.style.borderColor = '#e53e3e';
            } else if (confirmPassword) {
                confirmInput.style.borderColor = '#38a169';
            } else {
                confirmInput.style.borderColor = '#e2e8f0';
            }
        }

        // Toggle password visibility
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.nextElementSibling.nextElementSibling.querySelector('i');

            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        // Loading state management
        function setLoadingState(loading) {
            const submitBtn = document.getElementById('submitBtn');
            const btnText = submitBtn.querySelector('.btn-text');
            const loadingSpan = submitBtn.querySelector('.loading');

            if (loading) {
                btnText.style.display = 'none';
                loadingSpan.style.display = 'inline-flex';
                submitBtn.disabled = true;
            } else {
                btnText.style.display = 'inline-flex';
                loadingSpan.style.display = 'none';
                submitBtn.disabled = false;
            }
        }

        // Update date time
        function updateDateTime() {
            const now = new Date();
            const dateTimeElement = document.getElementById('currentDateTime');

            if (dateTimeElement) {
                const formatted = now.toLocaleString('vi-VN', {
                    weekday: 'long',
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                });

                dateTimeElement.textContent = `🕒 ${formatted}`;
            }
        }

        // Toast notification
        function showToast(message, type = 'info') {
            const alertContainer = document.getElementById('alertContainer');
            if (!alertContainer) return;

            const toast = document.createElement('div');
            toast.className = `alert alert-${type}`;
            toast.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
                <span>${message}</span>
            `;

            alertContainer.appendChild(toast);

            // Auto remove after 5 seconds
            setTimeout(() => {
                toast.remove();
            }, 5000);
        }

        // Logout function
        function logout() {
            localStorage.removeItem('accessToken');
            localStorage.removeItem('refreshToken');
            window.location.href = '../login/login.html';
        }
    </script>
</body>

</html>
