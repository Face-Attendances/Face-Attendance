<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Môn học của tôi - Hệ thống điểm danh khuôn mặt</title>
    <link rel="stylesheet" href="teacher.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .my-subjects-page {
            max-width: 1200px;
            margin: 24px auto;
            padding: 0 24px;
        }

        .page-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 32px;
            text-align: center;
            color: white;
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.3);
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .page-header p {
            opacity: 0.9;
            font-size: 1rem;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .subject-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .subject-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .subject-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.15);
        }

        .subject-card:hover::before {
            transform: scaleY(1);
        }

        .subject-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .subject-info h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 4px;
        }

        .subject-code {
            font-size: 0.875rem;
            color: #718096;
            font-family: 'Courier New', monospace;
        }

        .subject-stats {
            text-align: right;
        }

        .student-count {
            font-size: 1.5rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 4px;
        }

        .student-label {
            font-size: 0.75rem;
            color: #a0aec0;
        }

        .subject-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
            color: #4a5568;
        }

        .detail-item i {
            color: #667eea;
            width: 16px;
        }

        .subject-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.875rem;
            flex: 1;
            justify-content: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(72, 187, 120, 0.3);
        }

        .btn-warning {
            background: linear-gradient(135deg, #ed8936 0%, #dd6b20 100%);
            color: white;
        }

        .btn-warning:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(237, 137, 54, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: #718096;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.25rem;
            margin-bottom: 8px;
            color: #4a5568;
        }

        .empty-state p {
            font-size: 0.875rem;
        }

        .stats-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-card {
            text-align: center;
            padding: 20px;
            border-radius: 12px;
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
            border: 1px solid #e2e8f0;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 0.875rem;
            color: #718096;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .my-subjects-page {
                padding: 0 16px;
            }

            .page-header {
                padding: 24px;
            }

            .page-header h1 {
                font-size: 1.5rem;
            }

            .subjects-grid {
                grid-template-columns: 1fr;
            }

            .subject-details {
                grid-template-columns: 1fr;
            }

            .subject-actions {
                flex-direction: column;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="header-left">
            <img src="../assets/images/logo.png" alt="Logo UTH">
            <h1 class="header-title">Môn học của tôi</h1>
        </div>
        <div class="user-options">
            <span id="currentDateTime"></span>
            <div class="dropdown">
                <button id="userMenuBtn">
                    <i class="fas fa-user-tie"></i>
                    <span id="userName">Giảng viên</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="dropdown-content" id="userMenu">
                    <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
                    <a href="attendance-log.html"><i class="fas fa-clipboard-list"></i> Nhật ký điểm danh</a>
                    <a href="student-management.html"><i class="fas fa-users"></i> Quản lý sinh viên</a>
                    <a href="change-password.html"><i class="fas fa-key"></i> Đổi mật khẩu</a>
                    <a href="../login/login.html" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Đăng xuất</a>
                </div>
            </div>
        </div>
    </header>

    <main class="my-subjects-page">
        <!-- Alert Messages -->
        <div id="alertContainer"></div>

        <div class="page-header">
            <h1><i class="fas fa-book"></i> Môn học của tôi</h1>
            <p>Quản lý các môn học bạn đang giảng dạy</p>
        </div>

        <!-- Statistics -->
        <div class="stats-section">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="totalSubjects">0</div>
                    <div class="stat-label">Tổng môn học</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalStudents">0</div>
                    <div class="stat-label">Tổng sinh viên</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalCredits">0</div>
                    <div class="stat-label">Tổng tín chỉ</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="avgStudents">0</div>
                    <div class="stat-label">TB sinh viên/lớp</div>
                </div>
            </div>
        </div>

        <!-- Subjects Grid -->
        <div class="subjects-grid" id="subjectsGrid">
            <!-- Subjects will be loaded here -->
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2025 Hệ thống điểm danh khuôn mặt. All rights reserved.</p>
            <p>Được phát triển bởi UTH Team</p>
        </div>
    </footer>

    <script src="../shared/js/jquery-3.7.1.min.js"></script>
    <script src="teacher.js"></script>
    <script>
        // Global variables
        let teachingSubjects = [];

        // API endpoints (using the ones from teacher.js)
        const TEACHING_SUBJECTS_API = `${API_BASE_URL}/database/teacher-subjects/teaching/`;

        // Initialize page
        document.addEventListener('DOMContentLoaded', function () {
            checkAuthentication();
            loadTeachingSubjects();
            updateDateTime();
            setInterval(updateDateTime, 1000);
        });

        // Authentication check
        async function checkAuthentication() {
            const token = localStorage.getItem('accessToken');
            if (!token) {
                window.location.href = '../login/login.html';
                return;
            }
        }

        // Load teaching subjects
        async function loadTeachingSubjects() {
            try {
                const token = localStorage.getItem('accessToken');
                if (!token) return;

                const response = await fetch(TEACHING_SUBJECTS_API, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    teachingSubjects = await response.json();
                    displayTeachingSubjects();
                    updateStatistics();
                } else {
                    showToast('Lỗi khi tải danh sách môn học', 'error');
                }
            } catch (error) {
                console.error('Error loading teaching subjects:', error);
                showToast('Lỗi khi tải danh sách môn học', 'error');
            }
        }

        // Display teaching subjects
        function displayTeachingSubjects() {
            const grid = document.getElementById('subjectsGrid');

            if (teachingSubjects.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <i class="fas fa-book"></i>
                        <h3>Chưa có môn học nào</h3>
                        <p>Bạn chưa được phân công giảng dạy môn học nào</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = teachingSubjects.map(subject => `
                <div class="subject-card">
                    <div class="subject-header">
                        <div class="subject-info">
                            <h3>${subject.subject_name || 'Unknown'}</h3>
                            <div class="subject-code">${subject.subject_code || 'Unknown'}</div>
                        </div>
                        <div class="subject-stats">
                            <div class="student-count">${subject.student_count || 0}</div>
                            <div class="student-label">Sinh viên</div>
                        </div>
                    </div>
                    <div class="subject-details">
                        <div class="detail-item">
                            <i class="fas fa-clock"></i>
                            <span>${subject.schedule || 'Chưa có lịch học'}</span>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-map-marker-alt"></i>
                            <span>${subject.classroom || 'Chưa phân phòng'}</span>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-graduation-cap"></i>
                            <span>${subject.credits || 3} tín chỉ</span>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-calendar"></i>
                            <span>Học kỳ ${subject.semester || 'Hiện tại'}</span>
                        </div>
                    </div>
                    <div class="subject-actions">
                        <button class="btn btn-primary" onclick="startAttendance(${subject.id})">
                            <i class="fas fa-camera"></i> Điểm danh
                        </button>
                        <button class="btn btn-success" onclick="viewStudents(${subject.id})">
                            <i class="fas fa-users"></i> Sinh viên
                        </button>
                        <button class="btn btn-warning" onclick="viewAttendance(${subject.id})">
                            <i class="fas fa-chart-bar"></i> Thống kê
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Update statistics
        function updateStatistics() {
            const totalSubjects = teachingSubjects.length;
            const totalStudents = teachingSubjects.reduce((sum, subject) => sum + (subject.student_count || 0), 0);
            const totalCredits = teachingSubjects.reduce((sum, subject) => sum + (subject.credits || 3), 0);
            const avgStudents = totalSubjects > 0 ? Math.round(totalStudents / totalSubjects) : 0;

            document.getElementById('totalSubjects').textContent = totalSubjects;
            document.getElementById('totalStudents').textContent = totalStudents;
            document.getElementById('totalCredits').textContent = totalCredits;
            document.getElementById('avgStudents').textContent = avgStudents;
        }

        // Start attendance
        function startAttendance(subjectId) {
            // Redirect to attendance interface
            window.location.href = `attendance-interface.html?subject=${subjectId}`;
        }

        // View students
        function viewStudents(subjectId) {
            // Redirect to student management
            window.location.href = `student-management.html?subject=${subjectId}`;
        }

        // View attendance
        function viewAttendance(subjectId) {
            // Redirect to attendance log with subject filter
            window.location.href = `attendance-log.html?subject=${subjectId}`;
        }

        // Update date time
        function updateDateTime() {
            const now = new Date();
            const dateTimeElement = document.getElementById('currentDateTime');

            if (dateTimeElement) {
                const formatted = now.toLocaleString('vi-VN', {
                    weekday: 'long',
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                });

                dateTimeElement.textContent = `🕒 ${formatted}`;
            }
        }

        // Toast notification
        function showToast(message, type = 'info') {
            const alertContainer = document.getElementById('alertContainer');
            if (!alertContainer) return;

            const toast = document.createElement('div');
            toast.className = `alert alert-${type}`;
            toast.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
                <span>${message}</span>
            `;

            alertContainer.appendChild(toast);

            // Auto remove after 5 seconds
            setTimeout(() => {
                toast.remove();
            }, 5000);
        }

        // Logout function
        function logout() {
            localStorage.removeItem('accessToken');
            localStorage.removeItem('refreshToken');
            window.location.href = '../login/login.html';
        }
    </script>
</body>

</html>
