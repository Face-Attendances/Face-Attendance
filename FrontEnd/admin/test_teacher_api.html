<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Teacher API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .form-group {
            margin: 10px 0;
        }

        label {
            display: inline-block;
            width: 120px;
        }

        input,
        select {
            padding: 5px;
            width: 200px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .log {
            background: #f8f9fa;
            padding: 10px;
            margin: 10px 0;
            border-radius: 3px;
            font-family: monospace;
            white-space: pre-wrap;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }
    </style>
</head>

<body>
    <h1>Test Teacher API</h1>

    <div class="test-section">
        <h3>1. Test Login</h3>
        <div class="form-group">
            <label>Admin Code:</label>
            <input type="text" id="adminCode" value="admin">
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="adminPassword" value="admin123">
        </div>
        <button onclick="testLogin()">Test Login</button>
        <div id="loginResult" class="log"></div>
    </div>

    <div class="test-section">
        <h3>2. Test Create Teacher</h3>
        <div class="form-group">
            <label>Teacher Code:</label>
            <input type="text" id="teacherCode" value="123456789012">
        </div>
        <div class="form-group">
            <label>Name:</label>
            <input type="text" id="teacherName" value="Nguyễn Văn Test">
        </div>
        <div class="form-group">
            <label>Department:</label>
            <input type="text" id="teacherDepartment" value="CNTT">
        </div>
        <div class="form-group">
            <label>Day of Birth:</label>
            <input type="text" id="teacherDayofbirth" value="01/01/1990">
        </div>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="teacherEmail" value="test@example.com">
        </div>
        <div class="form-group">
            <label>Phone:</label>
            <input type="text" id="teacherPhone" value="0123456789">
        </div>
        <div class="form-group">
            <label>Address:</label>
            <input type="text" id="teacherAddress" value="Hà Nội">
        </div>
        <button onclick="testCreateTeacher()">Test Create Teacher</button>
        <div id="createResult" class="log"></div>
    </div>

    <div class="test-section">
        <h3>3. Test Get Teachers</h3>
        <button onclick="testGetTeachers()">Test Get Teachers</button>
        <div id="getResult" class="log"></div>
    </div>

    <div class="test-section">
        <h3>4. Test Delete Teacher</h3>
        <div class="form-group">
            <label>Teacher ID:</label>
            <input type="number" id="deleteTeacherId" placeholder="Enter teacher ID to delete">
        </div>
        <button onclick="testDeleteTeacher()">Test Delete Teacher</button>
        <div id="deleteResult" class="log"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api';
        let accessToken = '';

        function log(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : '';
            element.innerHTML += `[${timestamp}] ${message}\n`;
            element.className = `log ${className}`;
            console.log(message);
        }

        async function testLogin() {
            const code = document.getElementById('adminCode').value;
            const password = document.getElementById('adminPassword').value;

            log('loginResult', '=== Testing Login ===');
            log('loginResult', `Code: ${code}, Password: ${password}`);

            try {
                const response = await fetch(`${API_BASE}/auth/login/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ code, password })
                });

                log('loginResult', `Response status: ${response.status}`);
                log('loginResult', `Response ok: ${response.ok}`);

                if (response.ok) {
                    const data = await response.json();
                    accessToken = data.access;
                    log('loginResult', `Login successful! Token: ${accessToken.substring(0, 20)}...`, 'success');
                    log('loginResult', `Full response: ${JSON.stringify(data, null, 2)}`);
                } else {
                    const error = await response.json();
                    log('loginResult', `Login failed: ${JSON.stringify(error, null, 2)}`, 'error');
                }
            } catch (error) {
                log('loginResult', `Network error: ${error.message}`, 'error');
            }
        }

        async function testCreateTeacher() {
            if (!accessToken) {
                log('createResult', 'Please login first!', 'error');
                return;
            }

            const teacherData = {
                teacher_code: document.getElementById('teacherCode').value,
                name: document.getElementById('teacherName').value,
                department: document.getElementById('teacherDepartment').value,
                dayofbirth: document.getElementById('teacherDayofbirth').value,
                email: document.getElementById('teacherEmail').value,
                phone_number: document.getElementById('teacherPhone').value,
                address: document.getElementById('teacherAddress').value
            };

            log('createResult', '=== Testing Create Teacher ===');
            log('createResult', `Teacher data: ${JSON.stringify(teacherData, null, 2)}`);

            try {
                const response = await fetch(`${API_BASE}/database/teachers/create/`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(teacherData)
                });

                log('createResult', `Response status: ${response.status}`);
                log('createResult', `Response ok: ${response.ok}`);

                if (response.ok) {
                    const data = await response.json();
                    log('createResult', `Create successful!`, 'success');
                    log('createResult', `Response: ${JSON.stringify(data, null, 2)}`);
                } else {
                    const error = await response.json();
                    log('createResult', `Create failed: ${JSON.stringify(error, null, 2)}`, 'error');
                }
            } catch (error) {
                log('createResult', `Network error: ${error.message}`, 'error');
            }
        }

        async function testGetTeachers() {
            log('getResult', '=== Testing Get Teachers ===');

            try {
                const response = await fetch(`${API_BASE}/database/teachers/`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                log('getResult', `Response status: ${response.status}`);
                log('getResult', `Response ok: ${response.ok}`);

                if (response.ok) {
                    const data = await response.json();
                    log('getResult', `Get successful! Found ${data.length} teachers`, 'success');
                    log('getResult', `Response: ${JSON.stringify(data, null, 2)}`);
                } else {
                    const error = await response.json();
                    log('getResult', `Get failed: ${JSON.stringify(error, null, 2)}`, 'error');
                }
            } catch (error) {
                log('getResult', `Network error: ${error.message}`, 'error');
            }
        }

        async function testDeleteTeacher() {
            if (!accessToken) {
                log('deleteResult', 'Please login first!', 'error');
                return;
            }

            const teacherId = document.getElementById('deleteTeacherId').value;
            if (!teacherId) {
                log('deleteResult', 'Please enter teacher ID!', 'error');
                return;
            }

            log('deleteResult', `=== Testing Delete Teacher ID: ${teacherId} ===`);

            try {
                const response = await fetch(`${API_BASE}/database/teachers/${teacherId}/`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                log('deleteResult', `Response status: ${response.status}`);
                log('deleteResult', `Response ok: ${response.ok}`);

                if (response.ok) {
                    log('deleteResult', `Delete successful!`, 'success');
                } else {
                    const error = await response.json();
                    log('deleteResult', `Delete failed: ${JSON.stringify(error, null, 2)}`, 'error');
                }
            } catch (error) {
                log('deleteResult', `Network error: ${error.message}`, 'error');
            }
        }

        // Auto-generate random teacher code
        function generateRandomCode() {
            return Math.floor(100000000000 + Math.random() * 900000000000).toString();
        }

        // Auto-generate random email
        function generateRandomEmail() {
            const random = Math.random().toString(36).substring(7);
            return `test${random}@example.com`;
        }

        // Set random values on page load
        window.onload = function () {
            document.getElementById('teacherCode').value = generateRandomCode();
            document.getElementById('teacherEmail').value = generateRandomEmail();
        };
    </script>
</body>

</html>
