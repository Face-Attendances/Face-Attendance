<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý môn học - Hệ thống điểm danh khuôn mặt</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <nav class="navbar">
        <ul>
            <li><a href="overview.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a href="students.html"><i class="fas fa-user-graduate"></i> Sinh viên</a></li>
            <li><a href="teachers.html"><i class="fas fa-chalkboard-teacher"></i> Giảng viên</a></li>
            <li><a href="subjects.html" class="active"><i class="fas fa-book"></i> Môn học</a></li>
            <li><a href="attendance_log.html"><i class="fas fa-clipboard-check"></i> Điểm danh</a></li>
            <li><a href="../login/login.html"><i class="fas fa-sign-out-alt"></i> Đăng xuất</a></li>
        </ul>
    </nav>

    <div class="main-container">
        <div class="content-section">
            <div class="section-header">
                <h2 class="section-title">Quản lý môn học</h2>
                <button class="btn btn-primary" onclick="openModal('addSubjectModal')">
                    <i class="fas fa-plus"></i> Thêm môn học
                </button>
            </div>

            <div class="search-container">
                <input type="text" class="search-box" id="searchSubject"
                    placeholder="Tìm kiếm theo mã môn học, tên môn học...">
                <select class="filter-select" id="filterTeacher">
                    <option value="">Tất cả giảng viên</option>
                </select>
                <button class="btn btn-success" onclick="exportSubjects()">
                    <i class="fas fa-download"></i> Xuất Excel
                </button>
            </div>

            <table class="data-table">
                <thead>
                    <tr>
                        <th>Mã môn học</th>
                        <th>Tên môn học</th>
                        <th>Giảng viên</th>
                        <th>Thời gian</th>
                        <th>Phòng học</th>
                        <th>Số tín chỉ</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="subjectsTable">
                    <!-- Data will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add/Edit Subject Modal -->
    <div id="addSubjectModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="subjectModalTitle">Thêm môn học mới</h3>
                <span class="close" onclick="closeModal('addSubjectModal')">&times;</span>
            </div>
            <form id="subjectForm">
                <input type="hidden" id="subjectId" name="id">
                <div class="form-group">
                    <label class="form-label">Mã môn học *</label>
                    <input type="text" class="form-input" name="subject_code" id="subjectCode" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Tên môn học *</label>
                    <input type="text" class="form-input" name="name" id="subjectName" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Giảng viên *</label>
                    <select class="form-input" name="teacher" id="subjectTeacher" required>
                        <option value="">Chọn giảng viên</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Thời gian *</label>
                    <input type="text" class="form-input" name="time" id="subjectTime"
                        placeholder="VD: Thứ 2, 7:00-9:00" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Phòng học</label>
                    <input type="text" class="form-input" name="room" id="subjectRoom">
                </div>
                <div class="form-group">
                    <label class="form-label">Số tín chỉ</label>
                    <input type="number" class="form-input" name="credits" id="subjectCredits" min="1" max="10">
                </div>
                <div class="form-group">
                    <label class="form-label">Mô tả</label>
                    <textarea class="form-textarea" name="description" id="subjectDescription" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary" id="subjectSubmitBtn">Thêm môn học</button>
                    <button type="button" class="btn btn-danger" onclick="closeModal('addSubjectModal')">Hủy</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Xác nhận xóa</h3>
                <span class="close" onclick="closeModal('deleteModal')">&times;</span>
            </div>
            <div class="form-group">
                <p>Bạn có chắc chắn muốn xóa môn học <strong id="deleteSubjectName"></strong>?</p>
                <p>Hành động này không thể hoàn tác.</p>
            </div>
            <div class="form-group">
                <button type="button" class="btn btn-danger" onclick="confirmDelete()">Xóa</button>
                <button type="button" class="btn btn-primary" onclick="closeModal('deleteModal')">Hủy</button>
            </div>
        </div>
    </div>

    <script src="subjects.js"></script>
</body>

</html>
