<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Frontend Authentication</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .success {
            background-color: #d4edda;
            border-color: #c3e6cb;
        }

        .error {
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }

        .info {
            background-color: #d1ecf1;
            border-color: #bee5eb;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }

        #log {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>

<body>
    <h1>🧪 Test Frontend Authentication</h1>

    <div class="test-section info">
        <h3>🔍 Current Status</h3>
        <div id="status">Loading...</div>
    </div>

    <div class="test-section">
        <h3>🔐 Authentication Tests</h3>
        <button onclick="testLogin()">Test Login</button>
        <button onclick="testCreateStudent()">Test Create Student</button>
        <button onclick="testDeleteStudent()">Test Delete Student</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>

    <div class="test-section">
        <h3>📋 Test Log</h3>
        <div id="log"></div>
    </div>

    <script src="auth_helper.js"></script>
    <script>
        const API_BASE_URL = 'http://localhost:8000/api';
        let testStudentId = null;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.innerHTML = `<strong>[${timestamp}]</strong> ${message}`;
            logEntry.className = type;
            logDiv.appendChild(logEntry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateStatus() {
            const statusDiv = document.getElementById('status');
            const token = localStorage.getItem('accessToken');
            const refreshToken = localStorage.getItem('refreshToken');

            statusDiv.innerHTML = `
                <p><strong>Token:</strong> ${token ? '✅ Present' : '❌ Missing'}</p>
                <p><strong>Refresh Token:</strong> ${refreshToken ? '✅ Present' : '❌ Missing'}</p>
                <p><strong>Auth Helper:</strong> ${window.authHelper ? '✅ Loaded' : '❌ Not Loaded'}</p>
            `;
        }

        async function testLogin() {
            log('🔐 Testing login...', 'info');
            try {
                const success = await window.authHelper.login('079205011306', 'Admin@123');
                if (success) {
                    log('✅ Login successful!', 'success');
                } else {
                    log('❌ Login failed!', 'error');
                }
                updateStatus();
            } catch (error) {
                log(`❌ Login error: ${error.message}`, 'error');
            }
        }

        async function testCreateStudent() {
            log('👨‍🎓 Testing create student...', 'info');
            try {
                const studentData = {
                    student_code: "123456789012",
                    name: "Test Student Frontend",
                    student_class: "TEST-K99",
                    dayofbirth: "01/01/2000",
                    email: "testfrontend@example.com",
                    phone_number: "0123456789",
                    address: "Test Address Frontend"
                };

                const response = await window.authHelper.makeAuthenticatedRequest(`${API_BASE_URL}/database/students/create/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(studentData)
                });

                if (response && response.ok) {
                    const data = await response.json();
                    testStudentId = data.student.id;
                    log(`✅ Student created successfully! ID: ${testStudentId}`, 'success');
                } else {
                    const errorData = await response.json();
                    log(`❌ Create student failed: ${errorData.message || response.statusText}`, 'error');
                }
            } catch (error) {
                log(`❌ Create student error: ${error.message}`, 'error');
            }
        }

        async function testDeleteStudent() {
            if (!testStudentId) {
                log('❌ No test student to delete. Create one first!', 'error');
                return;
            }

            log(`🗑️ Testing delete student (ID: ${testStudentId})...`, 'info');
            try {
                const response = await window.authHelper.makeAuthenticatedRequest(`${API_BASE_URL}/database/students/${testStudentId}/delete/`, {
                    method: 'DELETE'
                });

                if (response && response.ok) {
                    log('✅ Student deleted successfully!', 'success');
                    testStudentId = null;
                } else {
                    log(`❌ Delete student failed: ${response.statusText}`, 'error');
                }
            } catch (error) {
                log(`❌ Delete student error: ${error.message}`, 'error');
            }
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            updateStatus();
            log('🚀 Frontend authentication test page loaded', 'info');
        });
    </script>
</body>

</html>
