<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng ký tài khoản</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Your existing admin styles (navbar, footer, etc.) -->
  <link rel="stylesheet" href="admin.css">

  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    main {
      flex: 1;
    }

    .card-register {
      border-radius: .75rem;
    }
  </style>
</head>

<body>

  <!-- NAVBAR Admin (từ admin.css) -->
  <nav class="navbar">
    <ul>
      <li><a href="admin.html">Trang chủ</a></li>
      <li><a href="student.html">Quản lý sinh viên</a></li>
      <li><a href="teacher.html">Quản lý giảng viên</a></li>
      <li><a href="log.html">Nhật ký điểm danh</a></li>
      <li><a href="register.html" class="active">Tạo tài khoản</a></li>
      <li><a href="../login/login.html">Đăng xuất</a></li>
    </ul>
  </nav>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm card-register">
          <div class="card-header bg-primary text-white text-center">
            <h4 class="mb-0">Đăng ký tài khoản mới</h4>
          </div>
          <div class="card-body p-4">
            <form id="registerForm" novalidate>
              <div class="mb-3">
                <label for="registerFullName" class="form-label">Họ và tên</label>
                <input type="text" id="registerFullName" class="form-control" placeholder="Ví dụ: Nguyễn Văn A"
                  required>
              </div>

              <div class="mb-3">
                <label for="registerStudentID" class="form-label">Mã số sinh viên</label>
                <input type="text" id="registerStudentID" class="form-control" placeholder="Ví dụ: SV001" required>
              </div>

              <div class="mb-3">
                <label for="registerName" class="form-label">Email (Tên đăng nhập)</label>
                <input type="email" id="registerName" class="form-control" placeholder="ví dụ: abc@domain.com" required>
              </div>

              <div class="mb-3">
                <label for="registerPassword" class="form-label">Mật khẩu</label>
                <input type="password" id="registerPassword" class="form-control" placeholder="Tối thiểu 6 kí tự"
                  minlength="6" required>
              </div>

              <div class="mb-4">
                <label for="registerPasswordConfirm" class="form-label">Xác nhận mật khẩu</label>
                <input type="password" id="registerPasswordConfirm" class="form-control" placeholder="Nhập lại mật khẩu"
                  required>
              </div>

              <button type="submit" class="btn btn-primary w-100">Đăng ký</button>
              <a href="admin.html" class="btn btn-outline-secondary w-100 mt-2">
                Quay lại trang Admin
              </a>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer chung -->
  <footer class="bg-light text-center py-3">
    <div class="container">
      <p class="mb-1">&copy; 2025. All rights reserved.</p>
      <p class="mb-0">UNIFIED UTH FACIAL RECOGNITION SYSTEM</p>
    </div>
  </footer>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Your register logic -->
  <script src="register.js"></script>
</body>

</html>
