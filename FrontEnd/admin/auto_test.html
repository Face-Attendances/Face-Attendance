<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Test Admin Functions</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .success {
            background-color: #d4edda;
            border-color: #c3e6cb;
        }

        .error {
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }

        .info {
            background-color: #d1ecf1;
            border-color: #bee5eb;
        }

        .warning {
            background-color: #fff3cd;
            border-color: #ffeaa7;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }

        #log {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            max-height: 500px;
            overflow-y: auto;
        }

        .progress {
            width: 100%;
            height: 20px;
            background-color: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: #007bff;
            transition: width 0.3s;
        }
    </style>
</head>

<body>
    <h1>🤖 Auto Test Admin Functions</h1>

    <div class="test-section info">
        <h3>📊 Test Progress</h3>
        <div class="progress">
            <div class="progress-bar" id="progressBar" style="width: 0%"></div>
        </div>
        <div id="progressText">0% Complete</div>
    </div>

    <div class="test-section">
        <h3>🎯 Test Controls</h3>
        <button onclick="runAllTests()">Run All Tests</button>
        <button onclick="testStudents()">Test Students Only</button>
        <button onclick="testTeachers()">Test Teachers Only</button>
        <button onclick="testSubjects()">Test Subjects Only</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>

    <div class="test-section">
        <h3>📋 Test Results</h3>
        <div id="log"></div>
    </div>

    <script src="auth_helper.js"></script>
    <script>
        const API_BASE_URL = 'http://localhost:8000/api';
        let testResults = {
            students: { created: [], deleted: [] },
            teachers: { created: [], deleted: [] },
            subjects: { created: [], deleted: [] }
        };

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.innerHTML = `<strong>[${timestamp}]</strong> ${message}`;
            logEntry.className = type;
            logDiv.appendChild(logEntry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateProgress(current, total) {
            const percentage = Math.round((current / total) * 100);
            document.getElementById('progressBar').style.width = percentage + '%';
            document.getElementById('progressText').textContent = `${percentage}% Complete (${current}/${total})`;
        }

        async function ensureAuthenticated() {
            log('🔐 Ensuring authentication...', 'info');
            const success = await window.authHelper.ensureAuthenticated();
            if (success) {
                log('✅ Authentication ready', 'success');
                return true;
            } else {
                log('❌ Authentication failed', 'error');
                return false;
            }
        }

        async function testCreateStudent() {
            const studentCode = `SV${Date.now()}`;
            const studentData = {
                student_code: studentCode,
                name: `Test Student ${studentCode}`,
                student_class: "TEST-K99",
                dayofbirth: "01/01/2000",
                email: `${studentCode}@example.com`,
                phone_number: "0123456789",
                address: "Test Address"
            };

            try {
                const response = await window.authHelper.makeAuthenticatedRequest(`${API_BASE_URL}/database/students/create/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(studentData)
                });

                if (response && response.ok) {
                    const data = await response.json();
                    testResults.students.created.push(data.student.id);
                    log(`✅ Student created: ${studentCode} (ID: ${data.student.id})`, 'success');
                    return data.student.id;
                } else {
                    const errorData = await response.json();
                    log(`❌ Create student failed: ${errorData.message || response.statusText}`, 'error');
                    return null;
                }
            } catch (error) {
                log(`❌ Create student error: ${error.message}`, 'error');
                return null;
            }
        }

        async function testDeleteStudent(studentId) {
            try {
                const response = await window.authHelper.makeAuthenticatedRequest(`${API_BASE_URL}/database/students/${studentId}/delete/`, {
                    method: 'DELETE'
                });

                if (response && response.ok) {
                    testResults.students.deleted.push(studentId);
                    log(`✅ Student deleted: ${studentId}`, 'success');
                    return true;
                } else {
                    log(`❌ Delete student failed: ${response.statusText}`, 'error');
                    return false;
                }
            } catch (error) {
                log(`❌ Delete student error: ${error.message}`, 'error');
                return false;
            }
        }

        async function testCreateTeacher() {
            const teacherCode = `GV${Date.now()}`;
            const teacherData = {
                teacher_code: teacherCode,
                name: `Test Teacher ${teacherCode}`,
                department: "Test Department",
                dayofbirth: "15/05/1985",
                email: `${teacherCode}@example.com`,
                phone_number: "0123456789",
                address: "Test Address"
            };

            try {
                const response = await window.authHelper.makeAuthenticatedRequest(`${API_BASE_URL}/database/teachers/create/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(teacherData)
                });

                if (response && response.ok) {
                    const data = await response.json();
                    testResults.teachers.created.push(data.teacher.id);
                    log(`✅ Teacher created: ${teacherCode} (ID: ${data.teacher.id})`, 'success');
                    return data.teacher.id;
                } else {
                    const errorData = await response.json();
                    log(`❌ Create teacher failed: ${errorData.message || response.statusText}`, 'error');
                    return null;
                }
            } catch (error) {
                log(`❌ Create teacher error: ${error.message}`, 'error');
                return null;
            }
        }

        async function testDeleteTeacher(teacherId) {
            try {
                const response = await window.authHelper.makeAuthenticatedRequest(`${API_BASE_URL}/database/teachers/${teacherId}/delete/`, {
                    method: 'DELETE'
                });

                if (response && response.ok) {
                    testResults.teachers.deleted.push(teacherId);
                    log(`✅ Teacher deleted: ${teacherId}`, 'success');
                    return true;
                } else {
                    log(`❌ Delete teacher failed: ${response.statusText}`, 'error');
                    return false;
                }
            } catch (error) {
                log(`❌ Delete teacher error: ${error.message}`, 'error');
                return false;
            }
        }

        async function testCreateSubject() {
            const subjectCode = `CS${Date.now()}`;
            const subjectData = {
                subject_code: subjectCode,
                subject_name: `Test Subject ${subjectCode}`,
                teacher: 1, // Assuming teacher ID 1 exists
                time: "Thứ 2, 8:00-11:00",
                room: "A101",
                credits: 3,
                description: "Test subject description"
            };

            try {
                const response = await window.authHelper.makeAuthenticatedRequest(`${API_BASE_URL}/database/subjects/create/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(subjectData)
                });

                if (response && response.ok) {
                    const data = await response.json();
                    testResults.subjects.created.push(data.id);
                    log(`✅ Subject created: ${subjectCode} (ID: ${data.id})`, 'success');
                    return data.id;
                } else {
                    const errorData = await response.json();
                    log(`❌ Create subject failed: ${errorData.message || response.statusText}`, 'error');
                    return null;
                }
            } catch (error) {
                log(`❌ Create subject error: ${error.message}`, 'error');
                return null;
            }
        }

        async function testDeleteSubject(subjectId) {
            try {
                const response = await window.authHelper.makeAuthenticatedRequest(`${API_BASE_URL}/database/subjects/${subjectId}/delete/`, {
                    method: 'DELETE'
                });

                if (response && response.ok) {
                    testResults.subjects.deleted.push(subjectId);
                    log(`✅ Subject deleted: ${subjectId}`, 'success');
                    return true;
                } else {
                    log(`❌ Delete subject failed: ${response.statusText}`, 'error');
                    return false;
                }
            } catch (error) {
                log(`❌ Delete subject error: ${error.message}`, 'error');
                return false;
            }
        }

        async function testStudents() {
            log('🎓 Testing Student Management...', 'info');

            // Create 2 students
            const student1 = await testCreateStudent();
            const student2 = await testCreateStudent();

            // Delete students
            if (student1) await testDeleteStudent(student1);
            if (student2) await testDeleteStudent(student2);

            log('🎓 Student management test completed', 'info');
        }

        async function testTeachers() {
            log('👨‍🏫 Testing Teacher Management...', 'info');

            // Create 2 teachers
            const teacher1 = await testCreateTeacher();
            const teacher2 = await testCreateTeacher();

            // Delete teachers
            if (teacher1) await testDeleteTeacher(teacher1);
            if (teacher2) await testDeleteTeacher(teacher2);

            log('👨‍🏫 Teacher management test completed', 'info');
        }

        async function testSubjects() {
            log('📚 Testing Subject Management...', 'info');

            // Create 2 subjects
            const subject1 = await testCreateSubject();
            const subject2 = await testCreateSubject();

            // Delete subjects
            if (subject1) await testDeleteSubject(subject1);
            if (subject2) await testDeleteSubject(subject2);

            log('📚 Subject management test completed', 'info');
        }

        async function runAllTests() {
            log('🚀 Starting comprehensive admin function tests...', 'info');

            const authenticated = await ensureAuthenticated();
            if (!authenticated) {
                log('❌ Cannot proceed without authentication', 'error');
                return;
            }

            let currentStep = 0;
            const totalSteps = 12; // 6 creates + 6 deletes

            // Test Students
            updateProgress(currentStep++, totalSteps);
            const student1 = await testCreateStudent();
            updateProgress(currentStep++, totalSteps);
            const student2 = await testCreateStudent();
            updateProgress(currentStep++, totalSteps);
            if (student1) await testDeleteStudent(student1);
            updateProgress(currentStep++, totalSteps);
            if (student2) await testDeleteStudent(student2);

            // Test Teachers
            updateProgress(currentStep++, totalSteps);
            const teacher1 = await testCreateTeacher();
            updateProgress(currentStep++, totalSteps);
            const teacher2 = await testCreateTeacher();
            updateProgress(currentStep++, totalSteps);
            if (teacher1) await testDeleteTeacher(teacher1);
            updateProgress(currentStep++, totalSteps);
            if (teacher2) await testDeleteTeacher(teacher2);

            // Test Subjects
            updateProgress(currentStep++, totalSteps);
            const subject1 = await testCreateSubject();
            updateProgress(currentStep++, totalSteps);
            const subject2 = await testCreateSubject();
            updateProgress(currentStep++, totalSteps);
            if (subject1) await testDeleteSubject(subject1);
            updateProgress(currentStep++, totalSteps);
            if (subject2) await testDeleteSubject(subject2);

            // Final summary
            log('🎉 All tests completed!', 'success');
            log(`📊 Summary: Created ${testResults.students.created.length + testResults.teachers.created.length + testResults.subjects.created.length} items, Deleted ${testResults.students.deleted.length + testResults.teachers.deleted.length + testResults.subjects.deleted.length} items`, 'info');
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
            testResults = { students: { created: [], deleted: [] }, teachers: { created: [], deleted: [] }, subjects: { created: [], deleted: [] } };
            updateProgress(0, 12);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            log('🤖 Auto test page loaded and ready', 'info');
        });
    </script>
</body>

</html>
