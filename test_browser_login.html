<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .form-group {
            margin: 10px 0;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            padding: 8px;
            width: 200px;
        }

        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>

<body>
    <h1>Test Login API</h1>

    <div class="form-group">
        <label for="code">Mã Số:</label>
        <input type="text" id="code" value="079205011306" maxlength="12">
    </div>

    <div class="form-group">
        <label for="password">Mật khẩu:</label>
        <input type="password" id="password" value="Admin@1234">
    </div>

    <button onclick="testLogin()">Test Login</button>

    <div id="result" class="result" style="display: none;"></div>

    <script>
        async function testLogin() {
            const code = document.getElementById('code').value.trim();
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');

            if (!code || !password) {
                showResult('Vui lòng nhập mã số và mật khẩu', false);
                return;
            }

            // Validate code format
            if (!/^\d{12}$/.test(code)) {
                showResult('Mã số phải có đúng 12 chữ số', false);
                return;
            }

            const loginData = {
                code: code,
                password: password
            };

            try {
                console.log('Sending request:', loginData);

                const response = await fetch('http://localhost:8000/api/users/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(loginData)
                });

                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);

                const responseText = await response.text();
                console.log('Response text:', responseText);

                if (response.ok) {
                    const data = JSON.parse(responseText);
                    showResult(`✅ Login thành công!<br>Role: ${data.role}<br>Code: ${data.code}<br>Token: ${data.access.substring(0, 50)}...`, true);
                } else {
                    try {
                        const errorData = JSON.parse(responseText);
                        const errorMessage = errorData.non_field_errors ? errorData.non_field_errors[0] : (errorData.detail || 'Đăng nhập thất bại');
                        showResult(`❌ ${errorMessage}`, false);
                    } catch {
                        showResult(`❌ HTTP ${response.status}: ${responseText}`, false);
                    }
                }

            } catch (error) {
                console.error('Error:', error);
                showResult(`❌ Lỗi kết nối: ${error.message}`, false);
            }
        }

        function showResult(message, isSuccess) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = message;
            resultDiv.className = `result ${isSuccess ? 'success' : 'error'}`;
            resultDiv.style.display = 'block';
        }
    </script>
</body>

</html>
