<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hệ thống điểm danh khuôn mặt</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="login-container">
        <div class="logo-section">
            <img src="../assets/images/logo.png" alt="Logo UTH">
            <h1>Hệ thống điểm danh khuôn mặt</h1>
            <p>Đăng nhập để tiếp tục</p>
        </div>

        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label class="form-label">Mã số</label>
                <div class="input-group">
                    <input type="text" class="form-input" id="username" name="username"
                        placeholder="Nhập mã số (12 chữ số)" maxlength="12" required>
                    <i class="input-icon fas fa-user"></i>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Mật khẩu</label>
                <div class="input-group">
                    <input type="password" class="form-input" id="password" name="password" placeholder="Nhập mật khẩu"
                        required>
                    <i class="input-icon fas fa-lock"></i>
                    <button type="button" class="password-toggle" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <span>Ghi nhớ đăng nhập</span>
                </label>
                <!-- Ẩn chức năng quên mật khẩu -->
                <!-- <a href="forgot-password.html" class="forgot-password">Quên mật khẩu?</a> -->
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span class="btn-text">Đăng nhập</span>
                <span class="loading" style="display: none;">
                    <i class="fas fa-spinner fa-spin"></i> Đang xử lý...
                </span>
            </button>
        </form>

        <!-- Ẩn social login và register link -->
        <!--
        <div class="divider">
            <span>hoặc</span>
        </div>

        <div class="social-login">
            <button class="social-btn" onclick="loginWithGoogle()">
                <i class="fab fa-google"></i>
                Google
            </button>
            <button class="social-btn" onclick="loginWithMicrosoft()">
                <i class="fab fa-microsoft"></i>
                Microsoft
            </button>
        </div>

        <div class="register-link">
            <span>Bạn chưa có tài khoản? </span>
            <a href="register.html">Đăng ký ngay</a>
        </div>
        -->
    </div>

    <!-- Error/Success Messages -->
    <div id="errorMessage" class="error-message" style="display: none;"></div>
    <div id="successMessage" class="success-message" style="display: none;"></div>

    <script src="../shared/js/jquery-3.7.1.min.js"></script>
    <script src="login.js"></script>
</body>

</html>
